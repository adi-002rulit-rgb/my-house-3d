name: ADKH House smoke tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run architectural smoke tests
        run: |
          node tests/editor-smoke.mjs
          node tests/shared-contract.mjs
          node tests/geometry-sync.mjs
          node tests/presentation-stair.mjs
