name: ADKH House browser smoke
on:
  push:
    branches: [main]
    paths:
      - 'editor.html'
      - 'index.html'
      - 'tests/browser-smoke.mjs'
      - '.github/workflows/browser-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright and browser
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Start static site
        run: python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/adkh-server.log 2>&1 &
      - name: Execute browser checks
        run: node tests/browser-smoke.mjs
      - name: Save visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adkh-browser-screenshots
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 14
