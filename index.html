<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Мой дом — 3D-прогулка по первому этажу</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#17202a;color:white;font:14px system-ui;touch-action:none}canvas{display:block;width:100vw;height:100dvh}#head{position:fixed;top:12px;left:12px;z-index:2;background:#142332bb;border-radius:12px;padding:9px 12px;max-width:57vw;pointer-events:none}#head strong{display:block;font-size:14px}#head small{font-size:11px;color:#e1e8ed}#actions{position:fixed;z-index:3;right:10px;top:10px;display:flex;gap:5px}button{border:1px solid #ffffff44;border-radius:12px;background:#152e40e8;color:white;font-weight:700;font-size:14px;padding:11px;touch-action:none}button:active{background:#557e91}#dpad{position:fixed;bottom:25px;left:16px;z-index:3;display:grid;grid-template-columns:repeat(3,54px);grid-template-rows:repeat(2,54px);gap:5px}#dpad button{font-size:24px;padding:5px}#turn{position:fixed;bottom:25px;right:16px;z-index:3;display:flex;gap:8px}#turn button{width:57px;height:57px;font-size:24px}#tip{position:fixed;bottom:151px;left:12px;right:12px;text-align:center;text-shadow:0 1px 4px #000;font-size:12px;pointer-events:none}@media (max-width:640px){#actions button{font-size:11px;padding:8px}#head{top:57px}#tip{bottom:130px}}@media(min-width:800px){#dpad,#turn{opacity:.65}}
</style></head><body><noscript><p style="padding:30px;color:white">Для 3D-прогулки необходимо открыть эту страницу в Safari или Chrome с включенным JavaScript.</p></noscript><canvas id="view"></canvas><div id="head"><strong>🏠 Первый этаж · прогулка</strong><small id="room">Коридор — приблизительная модель</small></div><div id="actions"><button id="top">🗺 План</button><button id="walk">🚶 Внутри</button><button id="reset">↺</button></div><div id="dpad"><span></span><button data-k="forward">▲</button><span></span><button data-k="left">◀</button><button data-k="back">▼</button><button data-k="right">▶</button></div><div id="turn"><button data-k="tl">↶</button><button data-k="tr">↷</button></div><div id="tip">Веди пальцем по экрану, чтобы осмотреться · кнопки — движение</div><script>
(()=>{'use strict';const cv=document.getElementById('view'),ctx=cv.getContext('2d',{alpha:false});if(!ctx){document.body.insertAdjacentHTML('afterbegin','<p style="position:fixed;top:35%;padding:20px;z-index:10;background:#332">Не удалось включить графику Canvas. Откройте страницу в Safari.</p>');return;}let W=0,H=0,DPR=1,mode='walk',px=17.5,py=12.6,angle=-Math.PI/2,held={},last=0,drag=null;const MW=34,MH=25,grid=Array.from({length:MH},()=>Array(MW).fill(0));const rects=[];function fill(x1,y1,x2,y2,n){for(let y=y1;y<=y2;y++)for(let x=x1;x<=x2;x++)if(x>=0&&y>=0&&x<MW&&y<MH)grid[y][x]=n}
fill(1,2,6,20,1);fill(2,3,5,19,0);fill(1,3,6,3,1);fill(1,11,6,11,1);fill(1,19,6,19,1);fill(1,2,6,2,1);fill(1,3,1,19,1);fill(6,3,6,19,1);grid[7][6]=0;grid[15][6]=0;grid[17][6]=0;grid[4][1]=0;
fill(16,4,32,16,1);fill(17,5,31,15,0);
fill(16,9,31,9,2);fill(22,4,22,9,2);fill(26,4,26,9,2);fill(29,4,29,9,2);
fill(24,9,24,16,2);fill(28,9,28,16,2);
for(const [x,y] of [[19,9],[23,9],[27,9],[30,9],[24,12],[28,12],[26,16],[27,16],[25,9]])grid[y][x]=0;
rects.push({x1:16,y1:10,x2:23,y2:15,name:'Зал 54 м²',floor:'#b7a08b'});rects.push({x1:25,y1:10,x2:27,y2:15,name:'Коридор 44,75 м²',floor:'#adabb0'});rects.push({x1:29,y1:10,x2:31,y2:15,name:'Кухня 30,20 м²',floor:'#c3bcad'});rects.push({x1:17,y1:5,x2:21,y2:8,name:'Спальня 21,84 м²',floor:'#bca990'});rects.push({x1:23,y1:5,x2:25,y2:8,name:'Ванная 9,38 м²',floor:'#b8c5c8'});rects.push({x1:27,y1:5,x2:28,y2:8,name:'Лестница на второй этаж',floor:'#aa987e'});rects.push({x1:30,y1:5,x2:31,y2:8,name:'Гардеробная 21,25 м²',floor:'#b6aa92'});rects.push({x1:2,y1:4,x2:5,y2:10,name:'Летняя кухня 50 м²',floor:'#c8b6a1'});rects.push({x1:2,y1:12,x2:5,y2:18,name:'Гараж 40 м²',floor:'#9faaa9'});
for(const [x,y] of [[18,4],[20,4],[24,4],[28,4],[31,7],[31,12],[19,16],[22,16],[30,16],[1,6],[1,14]])if(grid[y][x])grid[y][x]=3;
function room(){return rects.find(r=>px>=r.x1&&px<=r.x2+.99&&py>=r.y1&&py<=r.y2+.99)?.name || (px>8&&px<16?'Двор':'Проход / вход')}
function wall(x,y){if(x<0||y<0||x>=MW||y>=MH)return 1;return grid[y|0][x|0]}
function open(x,y){const r=.19;return !wall(x-r,y-r)&&!wall(x+r,y-r)&&!wall(x-r,y+r)&&!wall(x+r,y+r)}
function resize(){DPR=Math.min(devicePixelRatio||1,1.5);W=innerWidth;H=innerHeight;cv.width=Math.ceil(W*DPR);cv.height=Math.ceil(H*DPR);ctx.setTransform(DPR,0,0,DPR,0,0)}addEventListener('resize',resize);resize();
function shade(c,k){let m=c.match(/\w\w/g).map(x=>parseInt(x,16));return 'rgb('+m.map(v=>Math.max(0,Math.min(255,v*k))|0).join(',')+')'}
function renderWalk(){const sky=ctx.createLinearGradient(0,0,0,H*.57);sky.addColorStop(0,'#9ebbd0');sky.addColorStop(1,'#d4dae0');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H/2);const ground=ctx.createLinearGradient(0,H/2,0,H);ground.addColorStop(0,'#8f8980');ground.addColorStop(1,'#464845');ctx.fillStyle=ground;ctx.fillRect(0,H/2,W,H/2);
let cols=Math.min(470,Math.max(160,Math.ceil(W/2.4))),cw=W/cols;const fov=Math.PI/2.8;
for(let i=0;i<cols;i++){let a=angle+Math.atan((i/cols-.5)*2*Math.tan(fov/2)),dx=Math.cos(a),dy=Math.sin(a);let mapx=Math.floor(px),mapy=Math.floor(py),deltaX=Math.abs(1/dx),deltaY=Math.abs(1/dy);let sx=dx<0?-1:1,sy=dy<0?-1:1,distX=(dx<0?px-mapx:mapx+1-px)*deltaX,distY=(dy<0?py-mapy:mapy+1-py)*deltaY,side=0,kind=1,depth=30;
for(let q=0;q<65;q++){if(distX<distY){mapx+=sx;depth=distX;distX+=deltaX;side=0}else{mapy+=sy;depth=distY;distY+=deltaY;side=1}kind=wall(mapx,mapy);if(kind)break}
let corrected=Math.max(.13,depth*Math.cos(a-angle)),wallH=Math.min(H*5,H*.85/corrected*2.1),top=H/2-wallH/2;let base=kind===3?'#719fb9':kind===2?'#b9b4ac':'#d7d0c2';let light=Math.max(.23,1-corrected/35)*(side?.76:1);ctx.fillStyle=shade(base,light);ctx.fillRect(i*cw,top,cw+1,wallH);ctx.fillStyle='rgba(42,45,43,.18)';ctx.fillRect(i*cw,top,cw+1,Math.max(1,wallH*.025));if(kind===3){ctx.fillStyle='rgba(185,215,239,.38)';ctx.fillRect(i*cw,top+wallH*.17,cw+1,wallH*.53)} }
ctx.fillStyle='#172b39ae';ctx.fillRect(W/2-43,14,86,27);ctx.fillStyle='#fff';ctx.textAlign='center';ctx.font='13px system-ui';ctx.fillText('3D · первый этаж',W/2,32);
ctx.strokeStyle='#fff9';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(W/2-7,H/2);ctx.lineTo(W/2+7,H/2);ctx.moveTo(W/2,H/2-7);ctx.lineTo(W/2,H/2+7);ctx.stroke();}
function renderMap(){ctx.fillStyle='#e9e9e6';ctx.fillRect(0,0,W,H);let scale=Math.min((W-20)/MW,(H-120)/MH),ox=(W-MW*scale)/2,oy=(H-MH*scale)/2;for(let y=0;y<MH;y++)for(let x=0;x<MW;x++){let k=grid[y][x],r=rects.find(z=>x>=z.x1&&x<=z.x2&&y>=z.y1&&y<=z.y2);ctx.fillStyle=k===1?'#666b70':k===2?'#887b70':k===3?'#73b6cf':r?.floor||'#d8d6ce';ctx.fillRect(ox+x*scale,oy+y*scale,scale+.3,scale+.3)}ctx.font=Math.max(9,Math.min(12,scale*.85))+'px system-ui';ctx.textAlign='center';ctx.fillStyle='#222';for(let r of rects){if(r.x2-r.x1<2)continue;let name=r.name.replace(/\s[\d,.]+\sм²/,'');ctx.fillText(name,ox+(r.x1+r.x2+1)*scale/2,oy+(r.y1+r.y2+1)*scale/2)}ctx.fillStyle='#df3e2b';ctx.beginPath();ctx.arc(ox+px*scale,oy+py*scale,Math.max(4,scale*.3),0,Math.PI*2);ctx.fill();ctx.strokeStyle='#df3e2b';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(ox+px*scale,oy+py*scale);ctx.lineTo(ox+(px+Math.cos(angle)*1.8)*scale,oy+(py+Math.sin(angle)*1.8)*scale);ctx.stroke();ctx.fillStyle='#2d3540';ctx.font='bold 16px system-ui';ctx.fillText('СХЕМА ПЕРВОГО ЭТАЖА',W/2,Math.max(26,oy-16));}
function loop(t){let dt=Math.min(.05,(t-last)/1000||.016);last=t;if(mode==='walk'){let f=(held.forward||held.KeyW||held.ArrowUp?1:0)-(held.back||held.KeyS||held.ArrowDown?1:0),s=(held.right||held.KeyD?1:0)-(held.left||held.KeyA?1:0);let mvx=(Math.cos(angle)*f-Math.sin(angle)*s)*dt*2.25,mvy=(Math.sin(angle)*f+Math.cos(angle)*s)*dt*2.25;if(open(px+mvx,py))px+=mvx;if(open(px,py+mvy))py+=mvy;if(held.tl)angle-=dt*1.6;if(held.tr)angle+=dt*1.6;renderWalk()}else renderMap();document.getElementById('room').textContent=room()+' · схема приблизительная';requestAnimationFrame(loop)}
function reset(){px=26;py=13;angle=-Math.PI/2;mode='walk'}reset();document.getElementById('top').onclick=()=>mode='top';document.getElementById('walk').onclick=()=>mode='walk';document.getElementById('reset').onclick=reset;
for(const b of document.querySelectorAll('[data-k]')){let k=b.dataset.k;b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);held[k]=true});for(const ev of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(ev,()=>held[k]=false)}
addEventListener('keydown',e=>{held[e.code]=true;if(e.code==='KeyM')mode=mode==='top'?'walk':'top'});addEventListener('keyup',e=>held[e.code]=false);cv.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY};cv.setPointerCapture(e.pointerId)});cv.addEventListener('pointermove',e=>{if(!drag||mode!=='walk')return;let dx=e.clientX-drag.x;angle+=dx*.005;drag={x:e.clientX,y:e.clientY}});cv.addEventListener('pointerup',()=>drag=null);requestAnimationFrame(loop);
})();
</script></body></html>
